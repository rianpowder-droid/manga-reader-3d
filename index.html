<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chainsaw Man - 3D Manga Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:'Inter',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
header{margin-bottom:20px;text-align:center}
h1{color:#ff4757;font-size:22px;font-weight:600;letter-spacing:1px}
.subtitle{color:#666;font-size:12px;margin-top:4px}
.book-container{perspective:2500px;width:500px;height:700px;position:relative}
.spine{position:absolute;left:50%;top:0;width:4px;height:100%;background:linear-gradient(to right,#1a1a1a,#333,#1a1a1a);transform:translateX(-50%);z-index:5;box-shadow:0 0 20px rgba(0,0,0,.9)}
.book{width:100%;height:100%;position:relative;transform-style:preserve-3d}
.page{position:absolute;width:50%;height:100%;backface-visibility:hidden;overflow:hidden;background:#111;transition:transform .6s cubic-bezier(0.4,0,0.2,1)}
.page-left{left:0;border-radius:6px 0 0 6px;transform-origin:right center;z-index:2}
.page-right{right:0;border-radius:0 6px 6px 0;transform-origin:left center;z-index:1}
.page img{width:100%;height:100%;object-fit:cover;display:block}
.page.flipped-left{transform:rotateY(-180deg)}
.page.flipped-right{transform:rotateY(180deg)}
.page-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.4),transparent);pointer-events:none;z-index:3}
.controls{margin-top:24px;display:flex;gap:12px;align-items:center}
.controls button{background:#ff4757;color:#fff;border:none;padding:10px 24px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:500;transition:all .2s;letter-spacing:.5px}
.controls button:hover{background:#ff6b81;transform:translateY(-1px)}
.controls button:disabled{background:#2a2a2a;cursor:not-allowed;transform:none;opacity:.5}
.chapter-info{margin-top:12px;color:#555;font-size:13px;text-align:center}
.page-num{color:#ff4757;font-weight:600}
.manga-title{color:#ff4757;font-weight:600}
.loading{position:fixed;inset:0;background:#0a0a0f;display:flex;align-items:center;justify-content:center;font-size:18px;color:#ff4757;z-index:100;transition:opacity .5s}
.loading.hidden{opacity:0;pointer-events:none}
.kbd-hint{margin-top:8px;color:#444;font-size:11px}
</style>
</head>
<body>
<div class="loading" id="loading">Loading...</div>
<header>
<h1>Chainsaw Man</h1>
<p class="subtitle">3D Manga Reader</p>
</header>
<div class="book-container">
<div class="spine"></div>
<div class="book" id="book">
<div class="page page-left" id="leftPage">
<img id="leftImg" src="" alt="Left Page">
<div class="page-overlay"></div>
</div>
<div class="page page-right" id="rightPage">
<img id="rightImg" src="" alt="Right Page">
<div class="page-overlay"></div>
</div>
</div>
</div>
<div class="chapter-info"><span class="manga-title">Chainsaw Man</span> | Ch. <span id="chapter">1</span> | Pg. <span class="page-num" id="pageNum">1-2</span></div>
<div class="controls">
<button id="prevBtn" onclick="prevPage()">◀ Prev</button>
<button id="nextBtn" onclick="nextPage()">Next ▶</button>
</div>
<div class="kbd-hint">← → arrow keys | Space: next | R: restart</div>
<script>
let ch=1,totalCh=100,pg=1,totalPg=20,animating=false;
const leftImg=document.getElementById('leftImg');
const rightImg=document.getElementById('rightImg');
const leftPage=document.getElementById('leftPage');
const rightPage=document.getElementById('rightPage');

function getPageUrl(ch,pg){
if(ch===1&&pg===1)return 'https://upload.wikimedia.org/wikipedia/en/thumb/0/0a/Chainsawman.jpg/252px-Chainsawman.jpg';
return 'https://placehold.co/500x700/1a1a2e/ff4757?text=Ch.'+ch+'+P.'+pg;
}

function updatePages(){
document.getElementById('chapter').textContent=ch;
document.getElementById('pageNum').textContent=pg+'-'+(pg+1);
leftImg.src=getPageUrl(ch,pg);
rightImg.src=getPageUrl(ch,pg+1);
}

function nextPage(){
if(animating)return;
if(pg+2<=totalPg){pg+=2;animateFlip('next');}
else if(ch<totalCh){ch++;pg=1;updatePages();}
}
function prevPage(){
if(animating)return;
if(pg-2>=1){pg-=2;animateFlip('prev');}
else if(ch>1){ch--;pg=totalPg-1;if(pg<1)pg=1;updatePages();}
}
function animateFlip(dir){
animating=true;
if(dir==='next'){
rightPage.classList.add('flipped-right');
setTimeout(()=>{rightPage.classList.remove('flipped-right');updatePages();animating=false;},300);
}else{
leftPage.classList.add('flipped-left');
setTimeout(()=>{leftPage.classList.remove('flipped-left');updatePages();animating=false;},300);
}
}
document.addEventListener('keydown',e=>{
if(e.key==='ArrowRight'||e.key===' ')nextPage();
if(e.key==='ArrowLeft')prevPage();
if(e.key==='r'||e.key==='R'){ch=1;pg=1;updatePages();}
});
updatePages();
setTimeout(()=>{document.getElementById('loading').classList.add('hidden');},300);
</script>
</body>
</html>EOF
echo "done"
